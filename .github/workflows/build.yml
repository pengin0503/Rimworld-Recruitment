name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Unit tests
        run: dotnet test Tests/Recruitment.Tests -c Release

      - name: Build mod assembly
        run: dotnet build Source/Recruitment -c Release

      - name: Static checks (XML, translations, def references)
        run: python3 tools/check_mod.py
