name: Release

on:
  push:
    tags: ['v*']
  # Manual run: the release (and its tag) is created from the selected commit.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to create, e.g. v1.0.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build and verify the committed DLL
        run: |
          dotnet build Source/Recruitment -c Release
          git diff --exit-code -- 1.7/Assemblies/Recruitment.dll
          python3 tools/check_mod.py

      - name: Package the mod folder
        run: |
          mkdir -p "dist/ColonistRecruitment"
          cp -r About 1.7 Defs Languages Patches Textures "dist/ColonistRecruitment/"
          (cd dist && zip -r "ColonistRecruitment-${TAG}.zip" ColonistRecruitment)

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Colonist Recruitment ${{ env.TAG }}
          files: dist/ColonistRecruitment-${{ env.TAG }}.zip
          body: |
            RimWorld 1.7 用。前提MOD: Harmony（brrainz.harmony）。
            zip を展開した `ColonistRecruitment` フォルダーを `RimWorld/Mods/` に置き、MOD 一覧で Harmony の下で有効にしてください。
